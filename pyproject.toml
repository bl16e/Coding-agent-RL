[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "SWE-Bench Lite coding agent CLI and library"
requires-python = ">=3.11"
dependencies = [
    "mini-swe-agent>=2.3.0",
    "swe-rex>=1.4.0",
    "jinja2",
    "pyyaml",
    "pydantic>=2.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
